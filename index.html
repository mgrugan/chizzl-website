<!-- These four must be absolute: scrapers and search engines do not resolve
     relative URLs against the page they fetched. Everything else on this page
     stays relative so one build serves from the Pages subpath and from the
     apex alike.

     chizzl.co is the canonical home now; the github.io URL 301s here. -->
<meta property="og:url" content="https://chizzl.co/">
<meta property="og:image" content="https://chizzl.co/assets/img/og-image.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="apple-touch-icon" href="./assets/img/apple-touch-icon.png">
<link rel="preload" href="./assets/fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./assets/fonts/manrope-400-latin.woff2" as="font" type="font/woff2" crossorigin>

<!--
  Traffic arriving inside Instagram, Facebook, Messenger, Threads, TikTok or
  Reddit skips the landing page and goes straight to the App Store. Those visitors
  came from a bio link to download the app, and the in-app webview is also
  where App Store links are blocked, so the handling in /go/ is what they
  need — not a page to read.

  This sits above everything else and before the bundle so the redirect
  happens on the first paint, with no React and no fonts fetched first.
  Anywhere else — Safari, Chrome, desktop, search crawlers — falls straight
  through and gets the normal page.

  ?stay=1 is the escape hatch, set by the "Visit the site instead" link on
  /go/. Without it that link would bounce back here and be redirected
  again, forever. It is remembered for the session so navigating inside the
  site does not re-trigger.
-->
<script>
(function () {
  var ua = navigator.userAgent || '';
  if (!/Instagram|Threads|Barcelona|FBAN|FBAV|FB_IAB|FB4A|FBIOS|Messenger|BytedanceWebview|musical_ly|TikTok|Trill|aweme|Reddit/i.test(ua)) return;
  try {
    if (/[?&]stay=1/.test(location.search)) { sessionStorage.setItem('chizzl-stay', '1'); return; }
    if (sessionStorage.getItem('chizzl-stay') === '1') return;
  } catch (e) {}
  // replace(), so Back returns to the app the visitor came from rather than
  // landing here and being redirected a second time.
  location.replace('./go/' + (location.search || ''));
})();
</script>

<!--
  Cloudflare Web Analytics. No cookies, so no consent banner, and nothing is
  requested until a real token is set below — an empty or malformed one means
  the beacon is simply never injected.

  Deliberately placed AFTER the redirect above: a visitor being sent to /go/
  is leaving, so there is no reason to spend a request measuring them, and the
  redirect must not wait on this.

  Token: Cloudflare dashboard > Analytics & Logs > Web Analytics > Add a site.
  It is 32 hex characters. Adding a site there does NOT require moving DNS to
  Cloudflare.
-->
<script>
(function () {
  var TOKEN = '';
  if (!/^[0-9a-f]{32}$/.test(TOKEN)) return;
  var s = document.createElement('script');
  s.defer = true;
  s.src = 'https://static.cloudflareinsights.com/beacon.min.js';
  s.setAttribute('data-cf-beacon', JSON.stringify({ token: TOKEN }));
  document.head.appendChild(s);
})();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
