<!-- These four must be absolute: scrapers and search engines do not resolve
     relative URLs against the page they fetched. Everything else on this page
     stays relative so one build serves from the Pages subpath and from the
     apex alike.

     They point at the github.io URL until chizzl.co resolves — an absolute URL
     to a hostname that does not answer yet is a broken preview image and a
     canonical pointing at nothing. Once the domain is live these become
     https://chizzl.co/... (github.io 301s there in the meantime, so nothing
     breaks in either direction). -->
<meta property="og:url" content="https://mgrugan.github.io/chizzl-website/">
<meta property="og:image" content="https://mgrugan.github.io/chizzl-website/assets/img/og-image.png">
