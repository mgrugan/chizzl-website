name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/stitch-mcp-integration-x6s3i4
      - main
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages via OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement turns Pages on if it isn't already, so no manual
        # settings toggle is needed for the first deploy
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Asset versions are stamped at commit time by tools/stamp.py, not here,
      # because GitHub's legacy branch builder also publishes this repo and
      # serves it verbatim — anything done only in this workflow would be
      # skipped whenever that builder wins the race. This step just fails the
      # build if someone committed without re-stamping.
      - name: Verify asset versions are current
        run: |
          python3 tools/stamp.py
          if ! git diff --quiet -- index.html; then
            echo "::error::index.html asset versions are stale. Run 'python3 tools/stamp.py' and commit."
            git --no-pager diff -- index.html
            exit 1
          fi
          grep -o 'assets/[^"]*?v=[^"]*' index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
