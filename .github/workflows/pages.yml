name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/stitch-mcp-integration-x6s3i4
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The site is now a Vite build, so the repo root is source, not output.
      # GitHub's legacy branch builder would publish that source verbatim and
      # serve a broken page, so Pages has to build from Actions instead. This
      # flips the source once; it is a no-op on every run after the first.
      - name: Build Pages from Actions, not from the branch
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}')
          echo "set build_type=workflow -> HTTP $code"
          cat /tmp/pages.json 2>/dev/null || true

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
