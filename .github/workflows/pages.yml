name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/stitch-mcp-integration-x6s3i4
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # enablement:true is what actually switches Pages to the Actions
      # builder, which matters because the repo root is Vite source rather
      # than publishable output — the legacy branch builder would serve that
      # source verbatim as a broken page.
      #
      # There used to be a hand-rolled `PUT /repos/{owner}/{repo}/pages` step
      # here doing the same thing. It had returned 403 "Resource not
      # accessible by integration" on every run since the day it was added:
      # GITHUB_TOKEN with `pages: write` can create deployments but cannot
      # edit Pages settings, which needs repo admin. This action was doing the
      # work the whole time.
      #
      # The same 403 is why the custom domain is NOT set here. `cname` and
      # `https_enforced` live behind that endpoint, so they have to be set by
      # a repo admin in Settings > Pages, or by a workflow carrying a PAT.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
