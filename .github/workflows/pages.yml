name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/stitch-mcp-integration-x6s3i4
      - main
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages via OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement turns Pages on if it isn't already, so no manual
        # settings toggle is needed for the first deploy
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # GitHub Pages serves every file with cache-control: max-age=600 and
      # that cannot be configured. Without a version on the asset URLs a
      # returning visitor can load new HTML against a still-cached old
      # stylesheet and get a broken hybrid page. Stamping the commit SHA
      # means the HTML and the CSS/JS it depends on always update together.
      - name: Stamp asset versions
        run: |
          V="${GITHUB_SHA::8}"
          sed -i "s/?v=dev/?v=$V/g" index.html
          echo "Stamped assets with $V:"
          grep -o 'assets/[^"]*?v=[^"]*' index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
