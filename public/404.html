<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chizzl AI</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">

<!--
  Two jobs.

  1. Referral links. GitHub Pages is static, so there is no rewrite rule that
     can turn /r/kai into a redirect. Pages does serve this file for any path
     it cannot match, which is the only hook available — so /r/<code> is
     caught here and forwarded to /go/ with the code attached.

  2. An actual not-found page for everything else.

  The forward costs one extra request over linking /go/?r=<code> directly.
  That buys a link short enough to read out loud, which is the entire point of
  a referral link.
-->

<script>
(function () {
  // Mount-point agnostic: the site root is whatever precedes /r/, which makes
  // this work identically at chizzl.co and at the Pages project subpath.
  var path = location.pathname;

  // On *.github.io the site lives under /<repo>/; on the apex it is /. The
  // home button has to follow, since this file is served from paths that
  // relative URLs cannot be resolved against reliably.
  var root = '/';
  if (/\.github\.io$/.test(location.hostname)) {
    var seg = path.split('/')[1];
    if (seg) root = '/' + seg + '/';
  }
  document.addEventListener('DOMContentLoaded', function () {
    var home = document.getElementById('home');
    if (home) home.href = root;
  });

  var at = path.indexOf('/r/');
  if (at === -1) return;

  var code = path.slice(at + 3).replace(/\/+$/, '');
  if (!/^[A-Za-z0-9_-]{1,32}$/.test(code)) return;

  location.replace(path.slice(0, at + 1) + 'go/?r=' + encodeURIComponent(code));
})();
</script>

<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: #000; color: #F4F5F6;
    font: 400 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    padding: 24px calc(20px + env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom));
    text-align: center;
  }
  .wrap { width: 100%; max-width: 360px; }
  .mark {
    font-size: 13px; font-weight: 300; letter-spacing: .34em;
    text-transform: uppercase; color: #6E7378;
  }
  h1 { margin: 24px 0 0; font-size: 21px; font-weight: 300; letter-spacing: -.01em; }
  p  { margin: 10px 0 0; font-size: 14px; color: #9AA0A6; }
  a.btn {
    display: block; margin-top: 22px; padding: 15px 20px; border-radius: 12px;
    background: #27E08A; color: #04150C; font-weight: 600; font-size: 15px;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">Chizzl AI</div>
    <h1>Nothing here</h1>
    <p>That link does not point anywhere on this site.</p>
    <a class="btn" id="home" href="/">Go to Chizzl AI</a>
  </div>
</body>
</html>
